version: "3.8"

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: turf-oracle-db
    environment:
      - ORACLE_PASSWORD=oracle
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./scripts/init-oracle.sql:/opt/oracle/scripts/startup/init-oracle.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL' | sqlplus -S sys/oracle@//localhost:1521/XEPDB1 AS SYSDBA"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - turf-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: turf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - turf-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: turf-app
    env_file:
      - ../.env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=oracle://sys:oracle@oracle-db:1521/XEPDB1
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - turf-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: turf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../public:/var/www/html:ro
    depends_on:
      - app
    networks:
      - turf-network
    restart: unless-stopped

volumes:
  oracle-data:
  redis-data:

networks:
  turf-network:
    driver: bridge